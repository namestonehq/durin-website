name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Website
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ALCHEMY_API_KEY: xxxxxxxx
      NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: xxxxxxxx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
