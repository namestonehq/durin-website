name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Website
    runs-on: ubuntu-latest
    env:
      VITE_WALLET_CONNECT_PROJECT_ID: xxxxxxxx
      VITE_DRPC_API_KEY_FRONTEND: xxxxxxxx
      VITE_SUBGRAPH_URL: https://example.com
      VITE_SEPOLIA_SUBGRAPH_URL: https://example.com
      VITE_FACTORY_ADDRESS: "0xDddddDdDDD8Aa1f237b4fa0669cb46892346d22d"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
